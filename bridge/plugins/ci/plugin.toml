name = "ci"
title = "Пул-реквесты и проверки"
description = "Последние открытые PR репозитория GitHub или Forgejo и сколько их проверок упало, идёт и прошло (Actions и внешние CI). Без изменений — без обновления рамки."
i18n = { en = { title = "Pull requests and checks", description = "A repository's latest open GitHub or Forgejo PRs and how many of their checks failed, are running and passed (Actions and external CI). Unchanged — no frame update." } }
category = "news"
run = "run.py"
timeout_s = 40
outputs = ["card", "none"]
default_every = "15m"

[[param]]
id = "repo"
type = "string"
title = "Репозиторий"
required = true
note = "владелец/имя, например rust-lang/rust."
i18n = { en = { title = "Repository", note = "owner/name, for example rust-lang/rust." } }

[[param]]
id = "base"
type = "string"
title = "Целевая ветка"
note = "Только PR в эту ветку; пусто — все."
i18n = { en = { title = "Target branch", note = "Only PRs into this branch; empty — all of them." } }

[[param]]
id = "count"
type = "choice"
title = "Сколько PR"
choices = ["3", "4", "5", "6", "7"]
i18n = { en = { title = "How many PRs" } }
default = "6"

[[param]]
id = "forge"
type = "choice"
title = "Хостинг"
choices = ["github", "forgejo"]
default = "github"
note = "github — GitHub и GitHub Enterprise; forgejo — Forgejo или Gitea, вместе с адресом API."
i18n = { en = { title = "Forge", note = "github — GitHub and GitHub Enterprise; forgejo — Forgejo or Gitea, together with the API address." } }

[[param]]
id = "api"
type = "url"
title = "Адрес API"
default = "https://api.github.com"
note = "GitHub Enterprise: https://<сервер>/api/v3. Forgejo: https://<сервер>/api/v1."
i18n = { en = { title = "API address", note = "GitHub Enterprise: https://<server>/api/v3. Forgejo: https://<server>/api/v1." } }

[[param]]
id = "token"
type = "secret"
title = "Токен"
note = "GitHub — fine-grained, только чтение: Pull requests, Checks, Commit statuses. Без токена GitHub даёт 60 запросов в час, и за раз проверяются только 3 PR. Forgejo и Gitea — Settings → Applications, право read:repository (в Gitea — repo)."
i18n = { en = { title = "Token", note = "GitHub — fine-grained, read-only: Pull requests, Checks, Commit statuses. Without a token GitHub allows 60 requests an hour, and only 3 PRs are checked per run. Forgejo and Gitea — Settings → Applications, the read:repository scope (repo in Gitea)." } }
