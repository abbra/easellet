# The smallest useful plugin: a greeting card. A template for your own.
name = "hello"
title = "Привет"
description = "Карточка с приветствием и временем. Пример плагина на Python."
i18n = { en = { title = "Hello", description = "A greeting card with the time. An example plugin in Python." } }
category = "examples"
run = "run.py"
timeout_s = 5
outputs = ["card"]

[[param]]
id = "name"
type = "string"
title = "Кому"
default = "семья"
i18n = { en = { title = "For whom" } }

[[param]]
id = "accent"
type = "choice"
title = "Цвет"
choices = ["blue", "red", "green", "yellow", "black"]
default = "green"
i18n = { en = { title = "Colour" } }
