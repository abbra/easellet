name = "news"
title = "Новости"
description = "Заголовки из ленты RSS или Atom. Если заголовки не изменились, рамка не обновляется."
i18n = { en = { title = "News", description = "Headlines from an RSS or Atom feed. If the headlines did not change, the frame is not updated." } }
category = "news"
run = "run.py"
timeout_s = 20
outputs = ["card", "none"]
default_every = "1h"

[[param]]
id = "url"
type = "url"
title = "Адрес ленты"
required = true
i18n = { en = { title = "Feed address" } }
default = "https://yle.fi/rss/uutiset/paauutiset"

[[param]]
id = "count"
type = "choice"
title = "Сколько заголовков"
choices = ["3", "4", "5", "6", "7"]
i18n = { en = { title = "How many headlines" } }
default = "6"

[[param]]
id = "title"
type = "string"
title = "Заголовок карточки"
note = "Пусто — название ленты."
i18n = { en = { title = "Card heading", note = "Empty — the feed's own name." } }
