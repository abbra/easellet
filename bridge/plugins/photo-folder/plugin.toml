name = "photo-folder"
title = "Фото из папки"
description = "По очереди показывает фотографии из папки на машине моста (JPEG и PNG)."
i18n = { en = { title = "Photos from a folder", description = "Shows photographs from a folder on the bridge's machine in turn (JPEG and PNG)." } }
category = "pictures"
run = "run.py"
timeout_s = 20
outputs = ["image", "none"]
default_every = "1h"

[[param]]
id = "folder"
type = "string"
title = "Папка"
required = true
note = "Полный путь на машине моста, например /home/me/Pictures/frame."
i18n = { en = { title = "Folder", note = "A full path on the bridge's machine, for example /home/me/Pictures/frame." } }

[[param]]
id = "order"
type = "choice"
title = "Порядок"
choices = ["sequential", "random"]
i18n = { en = { title = "Order" } }
default = "sequential"

[[param]]
id = "fit"
type = "choice"
title = "Кадрирование"
choices = ["cover", "contain"]
i18n = { en = { title = "Cropping" } }
default = "cover"
