name = "note"
title = "Записка"
description = "Сообщение на рамку: заголовок и текст."
i18n = { en = { title = "Note", description = "A message for the frame: a heading and text." } }
category = "home"
run = "run.py"
timeout_s = 5
outputs = ["card"]

[[param]]
id = "title"
type = "string"
title = "Заголовок"
default = "Записка"
i18n = { en = { title = "Heading" } }

[[param]]
id = "text"
type = "text"
title = "Текст"
i18n = { en = { title = "Text" } }

[[param]]
id = "accent"
type = "choice"
title = "Цвет"
choices = ["blue", "red", "green", "yellow", "black"]
default = "blue"
i18n = { en = { title = "Colour" } }

[assistant]
text_param = "text"
phrases = ["оставь записку"]
intent = "оставить записку"
description = "Show a short note with a title and text on the frame."
