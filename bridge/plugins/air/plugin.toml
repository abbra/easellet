name = "air"
title = "Воздух"
description = "Качество воздуха, частицы и пыльца от Open-Meteo: без ключа и регистрации."
i18n = { en = { title = "Air", description = "Air quality, particles and pollen from Open-Meteo: no key and no signup." } }
category = "weather"
run = "run.py"
timeout_s = 20
outputs = ["card", "none"]
default_every = "3h"

[[param]]
id = "place"
type = "location"
title = "Место"
required = true
default = "Хельсинки"
note = "Название города или «широта,долгота», например 60.17,24.94."
i18n = { en = { title = "Place", note = "A city name or «latitude,longitude», for example 60.17,24.94." } }

[[param]]
id = "question"
type = "text"
title = "Вопрос"
hidden = true
note = "Заполняет ассистент: «какой воздух в Эспоо» показывает Эспоо вместо места по умолчанию."
i18n = { en = { title = "Question", note = "Filled by the assistant: «how is the air in Espoo» shows Espoo instead of the default place." } }

[assistant]
text_param = "question"
phrases = ["какой воздух", "качество воздуха", "воздух покажи", "какая пыльца", "пыльца", "air quality", "how is the air", "show the air", "pollen"]
intent = "показать качество воздуха"
description = "Show the air quality, the particles and the pollen on the frame."
