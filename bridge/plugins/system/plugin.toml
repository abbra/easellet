# Host status as a list card, in plain shell: plugins need no Python.
name = "system"
title = "Состояние моста"
description = "Нагрузка, память и диск машины, где работает мост. Пример плагина на sh."
i18n = { en = { title = "Bridge status", description = "Load, memory and disk of the machine running the bridge. An example plugin in sh." } }
run = "run.sh"
timeout_s = 5
outputs = ["card"]
default_every = "30m"
