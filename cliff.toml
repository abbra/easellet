# git cliff configuration: commit subjects become the changelog.
#
# The subjects are already conventional (`feat`, `fix`, `docs`, `refactor`,
# `build`), so the parsers only decide which heading a commit lands under and
# whether it is worth a reader's time. The scope is a bold prefix on the line
# rather than a second level of headings: `feat(bridge)` and `feat(firmware)`
# stay visible side by side, and the file stays one screen per release.

[changelog]
header = ""
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# A subject that is not conventional would otherwise land in a group of its own.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
    # The release commit itself, and nothing else, is housekeeping: the tag is
    # the announcement and its body would repeat the whole section.
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^revert", group = "Removed" },
    { message = "^refactor", group = "Changed" },
    { message = "^perf", group = "Changed" },
    { message = "^docs", group = "Changed" },
    { message = "^build", group = "Changed" },
    { message = "^chore", group = "Changed" },
    { message = "^test", group = "Changed" },
    { message = "^sec", group = "Security" },
]
