[package]
name = "easellet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[[bin]]
name = "easellet"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
opt-level = "z"
debug = true

[profile.release]
opt-level = "s"
debug = true
# Whole-program optimization across std, IDF bindings and this crate: about
# -100 KB (research/size-optimization.md). Inlining grows stack frames, so check
# `info`'s main_stack_min_free after changes on the SD/gallery path.
lto = "fat"
codegen-units = 1

[dependencies]
esp-idf-svc = { version = "=0.53.0", default-features = false, features = ["std", "binstart"] }
# OpenDisplay protocol (TODO.md P6), host-tested on its own: opendisplay-proto/build.sh.
opendisplay-proto = { path = "opendisplay-proto" }
zerocopy = "0.8"

[build-dependencies]
embuild = "=0.33.5"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
