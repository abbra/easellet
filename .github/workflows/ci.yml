# The gate: what every pull request and every push to main has to pass.
#
# Every job runs in the Fedora image built from the `Containerfile` at the root of
# the repository. GitHub-hosted runners are Ubuntu, Windows or macOS, so the image
# is how the toolchain stays the one this project builds with: the host crates
# link against Fedora's alsa-lib and glibc, and the firmware toolchain is Fedora's
# cargo plus Xtensa.
#
# The image is built and pushed with podman, the tool the same `Containerfile`
# builds with here; no job uses Docker.
#
# The image tag is the first twelve hex digits of the hash of its inputs:
#
#   cat Containerfile tools/requirements.txt tools/package-lock.json \
#       | sha256sum | cut -c1-12
#
# Changing any of those three means changing two lines here (CI_IMAGE and the
# `container: image:` of each job) and publishing the image from main; the `image`
# job refuses a tag that does not match its own inputs, so a forgotten bump is a
# red build with the right value in the message.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The jobs run in a published image, and a package made by a workflow is
  # private until someone changes that, so reading packages is not optional.
  packages: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this equal to the `container: image:` below and to the hash of the inputs.
  CI_IMAGE: ghcr.io/${{ github.repository }}/ci:07fa785ca23c
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Decide what this change can break
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A new branch pushes the all-zero sha, which no clone contains.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "$base" HEAD)"
          fi
          echo "$files" | sed -n '1,60p'
          # Everything except pure documentation and the web pages: those are the
          # `host` and `web` jobs' business, and the firmware build costs twenty
          # minutes of toolchain and IDF.
          if echo "$files" | grep -Eq '^(src/|Cargo\.|sdkconfig|partitions\.csv|scripts/|tools/|opendisplay-proto/|bridge/|\.cargo/|rust-toolchain\.toml|Containerfile|\.github/)'; then
            echo "firmware=true" >> "$GITHUB_OUTPUT"
          else
            echo "firmware=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Check the image tag against the image's inputs
        run: |
          set -euo pipefail
          hash="$(cat Containerfile tools/requirements.txt tools/package-lock.json \
                  | sha256sum | cut -c1-12)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/ci:$hash"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "inputs hash: $hash"
          if [ "$image" != "${CI_IMAGE,,}" ]; then
            echo "::error::the Containerfile, tools/requirements.txt or tools/package-lock.json changed: set CI_IMAGE and every container image to $image"
            exit 1
          fi
      - name: Let podman run rootless
        run: |
          set -euo pipefail
          podman --version
          # The runner image installs podman and buildah but not the two things a
          # rootless container needs beyond them, and says nothing about either.
          if ! grep -q "^${USER}:" /etc/subuid; then
            echo "${USER}:524288:65536" | sudo tee --append /etc/subuid /etc/subgid >/dev/null
          fi
          if ! podman info >/dev/null 2>&1; then
            # Ubuntu 24.04 restricts unprivileged user namespaces, which is
            # exactly what a rootless container is.
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          podman info --format 'rootless={{.Host.Security.Rootless}} storage={{.Store.GraphDriverName}}'
      - name: Pull the image, or build and publish it
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | podman login --username "${{ github.actor }}" --password-stdin ghcr.io
          if podman pull "$CI_IMAGE"; then
            echo "already published"
            exit 0
          fi
          # No `--file`: podman and buildah look for a `Containerfile` before a
          # `Dockerfile`, and this repository has the former.
          podman build --tag "$CI_IMAGE" .
          # A pull request from a fork has no packages: write. Its build proves
          # the image still builds; the tag itself has to come from main.
          if [ "$EVENT" = push ] || [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            podman push "$CI_IMAGE"
          else
            echo "::warning::built but not published: a fork cannot push to the registry, so the tag must exist from main"
          fi

  host:
    needs: [image]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci:07fa785ca23c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The two host crates
        run: |
          ./bridge/build.sh test
          ./bridge/build.sh clippy
          ./opendisplay-proto/build.sh test
          ./opendisplay-proto/build.sh clippy
      - name: The upstream Python client reads what the crate wrote
        run: |
          set -euo pipefail
          file=opendisplay-proto/tests/fixtures/py-opendisplay.txt
          url="$(sed -n 's/^url //p' "$file")"
          commit="$(sed -n 's/^commit //p' "$file")"
          git clone --quiet --filter=blob:none "$url" .tools/py-opendisplay
          git -C .tools/py-opendisplay checkout --quiet "$commit"
          python3 -m venv .tools/venv-opendisplay
          .tools/venv-opendisplay/bin/pip install --quiet -e ".tools/py-opendisplay[wifi]"
          ./opendisplay-proto/build.sh test

  web:
    needs: [image]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci:07fa785ca23c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The converters agree, in both languages
        run: |
          python3 tools/check-el6-js.py
          node tools/check-portal-js.mjs
      - name: The portal works in a browser
        run: |
          # The image carries the driver at /opt/easellet-tools; ESM does not read
          # NODE_PATH, so it is linked where `node` looks.
          ln -s /opt/easellet-tools/node_modules tools/node_modules
          EASEL_CHROMIUM=/usr/bin/chromium-browser node tools/run-portal-harness.mjs
      - name: The documentation
        run: python3 tools/check-docs.py

  firmware:
    needs: [image, changes]
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci:07fa785ca23c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain (1.6 GB) and IDF with its tools (4.5 GB) are the reason this
      # job has caches at all. Both live in the workspace, because that is where
      # `scripts/env.sh` and `.cargo/config.toml` put them.
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            .embuild
          key: esp-${{ hashFiles('.github/esp-toolchain.txt', '.cargo/config.toml', 'Cargo.lock') }}
      - uses: actions/cache@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: target
          key: target-${{ hashFiles('Cargo.lock', '.github/esp-toolchain.txt') }}-${{ github.sha }}
          restore-keys: |
            target-${{ hashFiles('Cargo.lock', '.github/esp-toolchain.txt') }}-
      - name: The toolchain
        env:
          # espup asks GitHub which Xtensa Rust is the newest before it installs
          # one. An anonymous caller gets 60 requests an hour for its address and
          # the hosted runners share theirs, so a busy morning fails the job with
          # "rate limit exceeded"; with a token the limit is the repository's own.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/env.sh
          # rustup's shims have to exist in the project's cargo home; Fedora's
          # cargo is what builds the host crates and stays untouched.
          rustup-init -y --no-modify-path --default-toolchain none
          # A restored cache already holds the toolchain and its export file, so
          # there is nothing to install and nothing to ask GitHub about.
          if [ -f .tools/export-esp.sh ] && rustup toolchain list | grep -q '^esp'; then
            echo "the cached toolchain is in place"
          else
            espup install --targets esp32s3 --export-file .tools/export-esp.sh
          fi
          # `.github/esp-toolchain.txt` is a pin only if something compares it:
          # espup installs the newest Xtensa Rust it can find, and this is what
          # stops a build from depending on the day.
          pin="$(sed -n 's/^xtensa-rust //p' .github/esp-toolchain.txt)"
          got="$(rustc --version | sed -n 's/.*(\([0-9][0-9.]*\))$/\1/p')"
          if [ "$got" != "$pin" ]; then
            echo "ERR the toolchain is ${got:-unknown}, the pin says $pin" >&2
            exit 1
          fi
          # `scripts/check.sh` runs esptool from `.venv-tools`; the image's Python
          # already has esptool and Pillow, so the venv only has to see them.
          python3 -m venv --system-site-packages .venv-tools
          cargo --version
          rustc --version
      - name: The whole local gate
        run: |
          source scripts/env.sh
          bash scripts/check.sh
      # A dev build has to say which build it is, or "what is on the frame"
      # stops being answerable once the dev release has moved on. The version
      # goes into a generated sdkconfig, never into a checked-in file, which is
      # what `scripts/build-firmware.sh` exists for.
      - name: The image a dev release installs
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          source scripts/env.sh
          version="$(python3 tools/check-version.py --print)"
          bash scripts/build-firmware.sh "$version-dev+g${GITHUB_SHA:0:7}" | tee target/dev-image.txt
      - name: The image fits the slot the frame is flashed with
        run: |
          set -euo pipefail
          image=target/xtensa-esp32s3-espidf/release/easellet.bin
          read -r slot slots <<< "$(python3 tools/partitions.py)"
          bytes="$(stat -c %s "$image")"
          echo "image $bytes bytes in a $slot-byte slot ($slots slots)"
          test "$slots" -ge 2
          test "$bytes" -le "$slot"
      - name: Collect what a release carries
        run: |
          set -euo pipefail
          image=target/xtensa-esp32s3-espidf/release/easellet.bin
          # A dev build prints the version it was asked to build; anything else
          # carries the version `Cargo.toml` names.
          facts=target/dev-image.txt
          [ -f "$facts" ] || printf 'version %s\n' "$(python3 tools/check-version.py --print)" > "$facts"
          version="$(sed -n 's/^version //p' "$facts")"
          mkdir -p dist
          cp "$facts" dist/build.txt
          cp "$image" "dist/easellet-$version.bin"
          cp target/xtensa-esp32s3-espidf/release/bootloader.bin dist/
          cp target/partition-table.bin dist/
          (cd dist && sha256sum "easellet-$version.bin" > "easellet-$version.bin.sha256")
          cat dist/easellet-*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist

  # The dev release is a moving target: one build, replaced on every green
  # `main`, so a person testing today's work asks for it once instead of
  # downloading a file. It is never a release: no tag anybody can point at.
  dev:
    needs: [image, changes, firmware]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    # Two main pushes in a row must not replace the release at the same time:
    # one job deleting assets while the other uploads them leaves a release
    # that is missing its image for a minute.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Replace the dev release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version //p' dist/build.txt)"
          idf="$(sed -n 's/^idf //p' dist/build.txt)"
          rust="$(sed -n 's/^rust //p' dist/build.txt)"
          image="easellet-$version.bin"
          read -r slot_bytes slots <<< "$(python3 tools/partitions.py)"
          python3 tools/firmware-index.py --channel dev \
            --version "$version" --tag firmware-dev \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --image "$image" \
            --bytes "$(stat -c %s "dist/$image")" \
            --sha256 "$(cut -d' ' -f1 "dist/$image.sha256")" \
            --url "https://github.com/$GH_REPO/releases/download/firmware-dev/$image" \
            --slot-bytes "$slot_bytes" --idf "$idf" --rust "$rust" \
            --commit "$(git rev-parse --short=7 HEAD)" \
            --notes "https://github.com/$GH_REPO/releases/tag/firmware-dev" \
            --out dist/firmware-index.json
          cat > dist/notes.md <<NOTES
          Dev build of Easellet $version.

          Built by CI from $(git rev-parse HEAD) on $(date -u +%Y-%m-%d).
          This release is replaced on every green \`main\`; it is not a version
          anybody should depend on. Install it through the bridge's frame card
          or the frame's own portal, or build the same image from that commit.
          NOTES
          if gh release view firmware-dev >/dev/null 2>&1; then
            gh release view firmware-dev --json assets --jq '.assets[].name' \
              | while read -r name; do gh release delete-asset firmware-dev "$name" -y; done
            gh release edit firmware-dev --prerelease --notes-file dist/notes.md
          else
            gh release create firmware-dev --prerelease --target main \
              --title 'Easellet dev build' --notes-file dist/notes.md
          fi
          gh release upload firmware-dev dist/easellet-*.bin* dist/firmware-index.json --clobber

  smoke:
    needs: [image, changes]
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci:07fa785ca23c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Start the real bridge and ask it what it serves
        run: |
          ./bridge/build.sh test
          python3 tools/bridge-smoke.py

  version:
    needs: [image, changes]
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci:07fa785ca23c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: One version, everywhere
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) python3 tools/check-version.py "${GITHUB_REF#refs/tags/}" ;;
            *) python3 tools/check-version.py ;;
          esac
      - name: The release index merges as its own rules say
        run: python3 tools/firmware-index.py --self-test
